# AWS Landing Zone Accelerator IAM Configuration
#
identityCenter:
  name: AWS-Identity-Center
  delegatedAdminAccount: Audit

permissionSets:
  - name: AdministratorAccess
    description: Full administrative access to AWS services and resources.
    sessionDuration: PT12H
    awsManagedPolicies:
      - arn:aws:iam::aws:policy/AdministratorAccess
  - name: Billing
    description: Access to billing, cost management, and payment methods.
    sessionDuration: PT4H
    awsManagedPolicies:
      - arn:aws:iam::aws:policy/job-function/Billing
  - name: SecurityAudit
    description: Read-only access for security audits and log analysis.
    sessionDuration: PT8H
    awsManagedPolicies:
      - arn:aws:iam::aws:policy/SecurityAudit
    customerManagedPolicies:
      - name: Accelerator-LogReadOnly

identityCenterAssignments:
  - name: Admins-To-Management
    permissionSetName: AdministratorAccess
    principalType: GROUP
    principalId: AWS-Accelerator-Admins
    deploymentTargets:
      accounts:
        - Management
  - name: Billing-To-Root
    permissionSetName: Billing
    principalType: GROUP
    principalId: AWS-Accelerator-Billing
    deploymentTargets:
      organizationalUnits:
        - Root
  - name: SecurityAudit-To-Security
    permissionSetName: SecurityAudit
    principalType: GROUP
    principalId: AWS-Accelerator-SecurityAudit
    deploymentTargets:
      organizationalUnits:
        - Security

# ─── Account-level IAM ──────────────────────────────────────────────────────────
# Distinct from Identity Center above: roles/users/groups/policies LZA
# provisions directly inside member accounts.

policySets:
  - name: Custom-Policies
    deploymentTargets:
      organizationalUnits:
        - Workloads
    policies:
      - name: S3-ReadOnly-Custom
        policy: include/policies/s3-readonly.json

roleSets:
  - name: EC2-Instance-Roles
    deploymentTargets:
      organizationalUnits:
        - Workloads
    roles:
      - name: EC2-SSM-Role
        assumedBy:
          - type: service
            principal: ec2.amazonaws.com
        policies:
          awsManaged:
            - AmazonSSMManagedInstanceCore
          customerManaged:
            - S3-ReadOnly-Custom
        instanceProfile: true
      - name: EC2-Backup-Role
        assumedBy:
          - type: service
            principal: ec2.amazonaws.com
        policies:
          awsManaged:
            - AWSBackupServiceRolePolicyForBackup
        boundaryPolicy: Custom-Permissions-Boundary
        instanceProfile: true

groupSets:
  - name: Break-Glass-Groups
    deploymentTargets:
      accounts:
        - Management
    groups:
      - name: BreakGlassAdministrators
        policies:
          awsManaged:
            - AdministratorAccess

userSets:
  - name: Break-Glass-Users
    deploymentTargets:
      accounts:
        - Management
    users:
      - username: break-glass-admin
        group: BreakGlassAdministrators
        boundaryPolicy: Custom-Permissions-Boundary
