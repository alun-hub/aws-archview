defaultVpc:
  delete: true

transitGateways:
  - name: Main-TGW
    account: Network
    region: {{HOME_REGION}}
    asn: {{ORG_ASN}}
    defaultRouteTableAssociation: disable
    defaultRouteTablePropagation: disable
    autoAcceptSharingAttachments: enable
    shareTargets:
      organizationalUnits:
        - Infrastructure
        - Workloads
    tags:
      - key: Environment
        value: Hub

customerGateways:
  - name: OnPrem-CGW
    account: Network
    region: {{HOME_REGION}}
    ipAddress: {{ONPREM_IP}}
    asn: {{ONPREM_ASN}}
    vpnConnections:
      - name: OnPrem-VPN
        transitGateway: Main-TGW
        routeTableAssociations:
          - routeTableName: VPN-RT
        routeTablePropagations:
          - routeTableName: Spoke-RT
        staticRoutesOnly: false
        tunnelSpecifications:
          - tunnelInsideCidr: 169.254.100.0/30
          - tunnelInsideCidr: 169.254.100.4/30

transitGatewayRouteTables:
  - name: Hub-RT
    transitGateway: Main-TGW
  - name: Spoke-RT
    transitGateway: Main-TGW
  - name: VPN-RT
    transitGateway: Main-TGW

vpcs: !include include/vpcs.yaml

centralNetworkServices:
  delegatedAdminAccount: Network
  route53Resolver:
    endpoints:
      - name: central-outbound-resolver
        type: OUTBOUND
        vpc: Endpoints-VPC
        subnets:
          - Endpoints-Subnet-A
          - Endpoints-Subnet-B
        allowedCidrs:
          - 10.0.0.0/8
        securityGroupNames:
          - resolver-sg
    rules:
      - name: corp-rule
        ruleType: FORWARD
        domainName: corp.internal
        resolverEndpoint: central-outbound-resolver
        targetIps:
          - ip: 192.168.1.10
        shareTargets:
          organizationalUnits:
            - Workloads
            - Infrastructure
    firewallRuleGroups:
      - name: Malware-Blocklist
        regions:
          - {{HOME_REGION}}
        rules:
          - name: Block-Malware
            action: BLOCK
            priority: 100
            blockResponse: NXDOMAIN
        shareTargets:
          organizationalUnits:
            - Workloads
            - Infrastructure
