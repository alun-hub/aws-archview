enable: true

organizationalUnits:
  - name: Security
    organizationalUnits: []
  - name: Infrastructure
    organizationalUnits:
      - name: Network
      - name: SharedServices
  - name: Workloads
    organizationalUnits:
      - name: Dev
      - name: Test
      - name: Prod
  - name: Sandbox
  - name: Suspended

serviceControlPolicies:
  - name: DenyRootUser
    description: Deny root user actions
    policy: include/policies/deny-root-user.json
    deploymentTargets:
      organizationalUnits:
        - Security
        - Infrastructure
        - Workloads
  - name: DenyLeavingOrganization
    description: Prevent accounts from leaving the organization
    policy: include/policies/deny-leave-org.json
    deploymentTargets:
      organizationalUnits:
        - Workloads
        - Sandbox

taggingPolicies:
  - name: RequireCostCenterTag
    description: Requires a CostCenter tag on all taggable resources
    policy: include/policies/require-cost-center-tag.json
    deploymentTargets:
      organizationalUnits:
        - Workloads

backupPolicies:
  - name: DailyBackupPlan
    description: Daily backups with 30-day retention for all workload accounts
    policy: include/policies/daily-backup-plan.json
    deploymentTargets:
      organizationalUnits:
        - Workloads
        - Infrastructure
