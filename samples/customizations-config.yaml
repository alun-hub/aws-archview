# LZA customizations-config.yaml — CloudFormation stacks / stacksets and
# Service Catalog portfolios live under the `customizations:` key; custom
# applications live under top-level `applications:`.
applications: []

customizations:
  cloudFormationStacks:
    - name: SC-Logging-Baseline
      description: Logging baseline resources for all accounts
      regions:
        - eu-west-1
      deploymentTargets:
        organizationalUnits:
          - Root
      template: cfn-templates/logging-baseline.yaml
      runOrder: 1
      terminationProtection: true

    - name: SC-Network-Firewall-Policy
      description: Shared Network Firewall policy for Inspection VPC
      regions:
        - eu-west-1
      deploymentTargets:
        accounts:
          - Network
      template: cfn-templates/network-firewall-policy.yaml
      runOrder: 2
      terminationProtection: true
      parameters:
        - name: LoggingBucket
          value: aws-accelerator-firewall-logs

    - name: SC-Sandbox-Guardrails
      description: Budget and tagging guardrails for sandbox accounts
      regions:
        - eu-west-1
        - eu-north-1
      deploymentTargets:
        organizationalUnits:
          - Sandbox
      template: cfn-templates/sandbox-guardrails.yaml
      runOrder: 3
      terminationProtection: false

  cloudFormationStackSets:
    - name: SSM-SessionManager-Config
      description: SSM Session Manager configuration across all workload accounts
      regions:
        - eu-west-1
        - eu-north-1
      # A deploymentTargets block matches an OU exactly — it does not reach
      # nested OUs the way an attached policy does, so every OU that holds
      # accounts must be listed.
      deploymentTargets:
        organizationalUnits:
          - Workloads/Dev
          - Workloads/Test
          - Workloads/Prod
          - Infrastructure/Network
          - Infrastructure/SharedServices
      template: cfn-templates/ssm-session-manager.yaml

  serviceCatalogPortfolios:
    # A portfolio lives in one account and is shared out, rather than being
    # deployed per target the way a stack is.
    - name: Platform-Products
      account: SharedServices
      provider: Platform Engineering
      regions:
        - eu-west-1
      shareTargets:
        organizationalUnits:
          - Workloads/Dev
          - Workloads/Test
          - Workloads/Prod
      products:
        - name: Standard-VPC
          owner: Platform Engineering
          description: Three-tier VPC with flow logs
          versions:
            - name: v1.2.0
              template: cfn-templates/product-standard-vpc.yaml
        - name: Encrypted-S3-Bucket
          owner: Platform Engineering
          description: S3 bucket with KMS encryption and access logging
          versions:
            - name: v2.0.1
              template: cfn-templates/product-encrypted-s3.yaml
