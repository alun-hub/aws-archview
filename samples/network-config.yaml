# Hub-and-Spoke Network — AWS Landing Zone Accelerator
#
# Traffic flows
# ─────────────────────────────────────────────────────
#  Inbound:   Internet ──► NLB (Ingress-VPC) ──► TGW ──► Spoke-VPC
#  Outbound:  Spoke-VPC ──► TGW ──► Inspection-VPC ──► NAT-GW ──► Internet
#  East-West: Spoke-VPC ──► TGW ──► Inspection-VPC (ANFW) ──► TGW ──► Spoke-VPC
#  VPN:       On-prem ──► VGW/CGW ──► TGW ──► Spokes (via Inspection)

defaultVpc:
  delete: true

# Required by the schema; referenced by interface and gateway endpoints.
endpointPolicies:
  - name: Default
    document: vpc-endpoint-policies/default.json

# ─── VPC Flow Logs ────────────────────────────────────────────────────────────
# Applies to every VPC below; a VPC may override it with its own block.
vpcFlowLogs:
  trafficType: ALL
  maxAggregationInterval: 600
  destinations:
    - s3
    - cloud-watch-logs
  defaultFormat: false
  customFields:
    - version
    - account-id
    - interface-id
    - srcaddr
    - dstaddr
    - srcport
    - dstport
    - protocol
    - action
    - log-status
    - vpc-id
    - subnet-id

# ─── Transit Gateway ──────────────────────────────────────────────────────────
transitGateways:
  - name: Main-TGW
    account: Network
    region: eu-west-1
    asn: 65521
    dnsSupport: enable
    vpnEcmpSupport: enable
    defaultRouteTableAssociation: disable
    defaultRouteTablePropagation: disable
    autoAcceptSharingAttachments: enable
    routeTables:
      - name: Ingress-RT
        routes: []
      - name: Spoke-RT
        routes:
          # East-west and outbound traffic is steered to the inspection VPC by
          # a static route. That is why the inspection attachment associates a
          # route table but propagates into none — it is reached deliberately,
          # not by learning its prefixes.
          - destinationCidrBlock: 0.0.0.0/0
            attachment:
              vpcName: Inspection-VPC
              account: Network
      - name: Inspection-RT
        routes: []
      - name: VPN-RT
        routes: []
    # shareTargets resolve like deploymentTargets: an exact OU match, so the
    # OUs that actually hold the spoke accounts have to be named.
    shareTargets:
      organizationalUnits:
        - Infrastructure/Network
        - Infrastructure/SharedServices
        - Workloads/Dev
        - Workloads/Test
        - Workloads/Prod
    tags:
      - key: Environment
        value: Hub

# ─── Customer Gateways (VPN) ─────────────────────────────────────────────────
customerGateways:
  - name: OnPrem-CGW
    account: Network
    region: eu-west-1
    ipAddress: 203.0.113.10          # On-premises public IP
    asn: 65000
    vpnConnections:
      - name: OnPrem-VPN
        transitGateway: Main-TGW
        routeTableAssociations:
          - VPN-RT
        routeTablePropagations:
          - Spoke-RT
        staticRoutesOnly: false
        tunnelSpecifications:
          - tunnelInsideCidr: 169.254.100.0/30
          - tunnelInsideCidr: 169.254.100.4/30

# ─── Direct Connect Gateways ───────────────────────────────────────────────────
directConnectGateways:
  - name: Accelerator-DXGW
    account: Network
    gatewayName: Accelerator-DXGW
    asn: 64512
    virtualInterfaces:
      - name: Accelerator-VIF
        connectionId: dx-12345678
        customerAsn: 64513
        interfaceName: Accelerator-VIF
        ownerAccount: Network
        type: transit
        region: eu-west-1
        vlan: 100
    transitGatewayAssociations:
      - name: Main-TGW
        account: Network
        routeTableAssociations:
          - VPN-RT
        allowedPrefixes:
          - 10.0.0.0/8

# ─── VPCs ─────────────────────────────────────────────────────────────────────
vpcs:

  # ── Ingress VPC ─────────────────────────────────────────────────────────────
  # Handles inbound traffic from internet via NLB → forwards to spokes via TGW
  - name: Ingress-VPC
    account: Network
    region: eu-west-1
    cidrs:
      - 10.0.0.0/23
    internetGateway: true
    enableDnsHostnames: true
    enableDnsSupport: true
    dnsFirewallRuleGroups:
      - name: Block-Malicious-Domains
        priority: 101
        mutationProtection: ENABLED
    routeTables:
      - name: Public-RT
        routes:
          - name: Igw-Default
            destination: 0.0.0.0/0
            type: internetGateway
      - name: NLB-RT
        routes:
          - name: Tgw-Spokes
            destination: 10.0.0.0/8
            type: transitGateway
            target: Main-TGW
          - name: Tgw-Default
            destination: 0.0.0.0/0
            type: transitGateway
            target: Main-TGW
      - name: TGW-RT
        routes:
          - name: Tgw-Default
            destination: 0.0.0.0/0
            type: transitGateway
            target: Main-TGW
    subnets:
      - name: Public-Subnet-A
        availabilityZone: a
        routeTable: Public-RT
        ipv4CidrBlock: 10.0.0.0/26
      - name: Public-Subnet-B
        availabilityZone: b
        routeTable: Public-RT
        ipv4CidrBlock: 10.0.0.64/26
      - name: NLB-Private-Subnet-A
        availabilityZone: a
        routeTable: NLB-RT
        ipv4CidrBlock: 10.0.0.128/26
      - name: NLB-Private-Subnet-B
        availabilityZone: b
        routeTable: NLB-RT
        ipv4CidrBlock: 10.0.0.192/26
      - name: TGW-Attach-Subnet-A
        availabilityZone: a
        routeTable: TGW-RT
        ipv4CidrBlock: 10.0.1.0/28
      - name: TGW-Attach-Subnet-B
        availabilityZone: b
        routeTable: TGW-RT
        ipv4CidrBlock: 10.0.1.16/28
    transitGatewayAttachments:
      - name: Ingress-TGW-Attachment
        transitGateway:
          name: Main-TGW
          account: Network
        routeTableAssociations:
          - Ingress-RT
        routeTablePropagations:
          - Spoke-RT
        subnets:
          - TGW-Attach-Subnet-A
          - TGW-Attach-Subnet-B
    tags:
      - key: Purpose
        value: Ingress

  # ── Inspection / Egress VPC ─────────────────────────────────────────────────
  # AWS Network Firewall for east-west + egress inspection, NAT Gateway for egress
  - name: Inspection-VPC
    account: Network
    region: eu-west-1
    cidrs:
      - 10.0.4.0/22
    internetGateway: true
    enableDnsHostnames: true
    enableDnsSupport: true
    routeTables:
      - name: Firewall-RT
        routes:
          - name: Tgw-Default
            destination: 0.0.0.0/0
            type: transitGateway
            target: Main-TGW
      - name: NAT-RT
        routes:
          - name: Igw-Default
            destination: 0.0.0.0/0
            type: internetGateway
      - name: TGW-RT
        routes:
          - name: Tgw-Default
            destination: 0.0.0.0/0
            type: transitGateway
            target: Main-TGW
    subnets:
      - name: Firewall-Subnet-A
        availabilityZone: a
        routeTable: Firewall-RT
        ipv4CidrBlock: 10.0.4.0/26
      - name: Firewall-Subnet-B
        availabilityZone: b
        routeTable: Firewall-RT
        ipv4CidrBlock: 10.0.4.64/26
      - name: NAT-Public-Subnet-A
        availabilityZone: a
        routeTable: NAT-RT
        ipv4CidrBlock: 10.0.4.128/26
      - name: NAT-Public-Subnet-B
        availabilityZone: b
        routeTable: NAT-RT
        ipv4CidrBlock: 10.0.4.192/26
      - name: TGW-Attach-Subnet-A
        availabilityZone: a
        routeTable: TGW-RT
        ipv4CidrBlock: 10.0.5.0/28
      - name: TGW-Attach-Subnet-B
        availabilityZone: b
        routeTable: TGW-RT
        ipv4CidrBlock: 10.0.5.16/28
    transitGatewayAttachments:
      - name: Inspection-TGW-Attachment
        transitGateway:
          name: Main-TGW
          account: Network
        routeTableAssociations:
          - Inspection-RT
        routeTablePropagations: []    # Inspection VPC does NOT propagate routes
        subnets:
          - TGW-Attach-Subnet-A
          - TGW-Attach-Subnet-B
    tags:
      - key: Purpose
        value: Inspection-Egress

  # ── Shared Services VPC ─────────────────────────────────────────────────────
  # Centralised: Active Directory, DNS (Route 53 Resolver), patch management
  - name: SharedServices-VPC
    account: SharedServices
    region: eu-west-1
    cidrs:
      - 10.1.0.0/22
    enableDnsHostnames: true
    enableDnsSupport: true
    routeTables:
      - name: App-RT
        routes:
          - name: Tgw-Default
            destination: 0.0.0.0/0
            type: transitGateway
            target: Main-TGW
      - name: Endpoint-RT
        routes:
          - name: Tgw-Default
            destination: 0.0.0.0/0
            type: transitGateway
            target: Main-TGW
      - name: TGW-RT
        routes:
          - name: Tgw-Default
            destination: 0.0.0.0/0
            type: transitGateway
            target: Main-TGW
    subnets:
      - name: App-Private-Subnet-A
        availabilityZone: a
        routeTable: App-RT
        ipv4CidrBlock: 10.1.0.0/24
      - name: App-Private-Subnet-B
        availabilityZone: b
        routeTable: App-RT
        ipv4CidrBlock: 10.1.1.0/24
      - name: Endpoint-Subnet-A
        availabilityZone: a
        routeTable: Endpoint-RT
        ipv4CidrBlock: 10.1.2.0/25
      - name: Endpoint-Subnet-B
        availabilityZone: b
        routeTable: Endpoint-RT
        ipv4CidrBlock: 10.1.2.128/25
      - name: TGW-Attach-Subnet-A
        availabilityZone: a
        routeTable: TGW-RT
        ipv4CidrBlock: 10.1.3.0/28
      - name: TGW-Attach-Subnet-B
        availabilityZone: b
        routeTable: TGW-RT
        ipv4CidrBlock: 10.1.3.16/28
    transitGatewayAttachments:
      - name: SharedServices-TGW-Attachment
        transitGateway:
          name: Main-TGW
          account: Network
        routeTableAssociations:
          - Spoke-RT
        routeTablePropagations:
          - Spoke-RT
        subnets:
          - TGW-Attach-Subnet-A
          - TGW-Attach-Subnet-B

  # ── Dev VPC ──────────────────────────────────────────────────────────────────
  - name: Dev-VPC
    account: Dev-Application
    region: eu-west-1
    cidrs:
      - 10.10.0.0/21
    enableDnsHostnames: true
    enableDnsSupport: true
    routeTables:
      - name: App-RT
        routes:
          - name: Tgw-Default
            destination: 0.0.0.0/0
            type: transitGateway
            target: Main-TGW
      - name: Data-RT
        routes:
          - name: Tgw-Default
            destination: 0.0.0.0/0
            type: transitGateway
            target: Main-TGW
      - name: TGW-RT
        routes:
          - name: Tgw-Default
            destination: 0.0.0.0/0
            type: transitGateway
            target: Main-TGW
    subnets:
      - name: App-Private-Subnet-A
        availabilityZone: a
        routeTable: App-RT
        ipv4CidrBlock: 10.10.0.0/24
      - name: App-Private-Subnet-B
        availabilityZone: b
        routeTable: App-RT
        ipv4CidrBlock: 10.10.1.0/24
      - name: Data-Private-Subnet-A
        availabilityZone: a
        routeTable: Data-RT
        ipv4CidrBlock: 10.10.2.0/24
      - name: Data-Private-Subnet-B
        availabilityZone: b
        routeTable: Data-RT
        ipv4CidrBlock: 10.10.3.0/24
      - name: TGW-Attach-Subnet-A
        availabilityZone: a
        routeTable: TGW-RT
        ipv4CidrBlock: 10.10.4.0/28
      - name: TGW-Attach-Subnet-B
        availabilityZone: b
        routeTable: TGW-RT
        ipv4CidrBlock: 10.10.4.16/28
    transitGatewayAttachments:
      - name: Dev-TGW-Attachment
        transitGateway:
          name: Main-TGW
          account: Network
        routeTableAssociations:
          - Spoke-RT
        routeTablePropagations:
          - Spoke-RT
        subnets:
          - TGW-Attach-Subnet-A
          - TGW-Attach-Subnet-B

  # ── Test VPC ─────────────────────────────────────────────────────────────────
  - name: Test-VPC
    account: Test-Application
    region: eu-west-1
    cidrs:
      - 10.11.0.0/21
    routeTables:
      - name: App-RT
        routes:
          - name: Tgw-Default
            destination: 0.0.0.0/0
            type: transitGateway
            target: Main-TGW
      - name: Data-RT
        routes:
          - name: Tgw-Default
            destination: 0.0.0.0/0
            type: transitGateway
            target: Main-TGW
      - name: TGW-RT
        routes:
          - name: Tgw-Default
            destination: 0.0.0.0/0
            type: transitGateway
            target: Main-TGW
    subnets:
      - name: App-Private-Subnet-A
        availabilityZone: a
        routeTable: App-RT
        ipv4CidrBlock: 10.11.0.0/24
      - name: App-Private-Subnet-B
        availabilityZone: b
        routeTable: App-RT
        ipv4CidrBlock: 10.11.1.0/24
      - name: Data-Private-Subnet-A
        availabilityZone: a
        routeTable: Data-RT
        ipv4CidrBlock: 10.11.2.0/24
      - name: Data-Private-Subnet-B
        availabilityZone: b
        routeTable: Data-RT
        ipv4CidrBlock: 10.11.3.0/24
      - name: TGW-Attach-Subnet-A
        availabilityZone: a
        routeTable: TGW-RT
        ipv4CidrBlock: 10.11.4.0/28
      - name: TGW-Attach-Subnet-B
        availabilityZone: b
        routeTable: TGW-RT
        ipv4CidrBlock: 10.11.4.16/28
    transitGatewayAttachments:
      - name: Test-TGW-Attachment
        transitGateway:
          name: Main-TGW
          account: Network
        routeTableAssociations:
          - Spoke-RT
        routeTablePropagations:
          - Spoke-RT
        subnets:
          - TGW-Attach-Subnet-A
          - TGW-Attach-Subnet-B

  # ── Prod VPC ─────────────────────────────────────────────────────────────────
  - name: Prod-VPC
    account: Prod-Application
    region: eu-west-1
    cidrs:
      - 10.20.0.0/21
    enableDnsHostnames: true
    enableDnsSupport: true
    routeTables:
      - name: App-RT
        routes:
          - name: Tgw-Default
            destination: 0.0.0.0/0
            type: transitGateway
            target: Main-TGW
      - name: Data-RT
        routes:
          - name: Tgw-Default
            destination: 0.0.0.0/0
            type: transitGateway
            target: Main-TGW
      - name: TGW-RT
        routes:
          - name: Tgw-Default
            destination: 0.0.0.0/0
            type: transitGateway
            target: Main-TGW
    subnets:
      - name: App-Private-Subnet-A
        availabilityZone: a
        routeTable: App-RT
        ipv4CidrBlock: 10.20.0.0/24
      - name: App-Private-Subnet-B
        availabilityZone: b
        routeTable: App-RT
        ipv4CidrBlock: 10.20.1.0/24
      - name: App-Private-Subnet-C
        availabilityZone: c
        routeTable: App-RT
        ipv4CidrBlock: 10.20.2.0/24
      - name: Data-Private-Subnet-A
        availabilityZone: a
        routeTable: Data-RT
        ipv4CidrBlock: 10.20.3.0/24
      - name: Data-Private-Subnet-B
        availabilityZone: b
        routeTable: Data-RT
        ipv4CidrBlock: 10.20.4.0/24
      - name: Data-Private-Subnet-C
        availabilityZone: c
        routeTable: Data-RT
        ipv4CidrBlock: 10.20.5.0/24
      - name: TGW-Attach-Subnet-A
        availabilityZone: a
        routeTable: TGW-RT
        ipv4CidrBlock: 10.20.6.0/28
      - name: TGW-Attach-Subnet-B
        availabilityZone: b
        routeTable: TGW-RT
        ipv4CidrBlock: 10.20.6.16/28
      - name: TGW-Attach-Subnet-C
        availabilityZone: c
        routeTable: TGW-RT
        ipv4CidrBlock: 10.20.6.32/28
    transitGatewayAttachments:
      - name: Prod-TGW-Attachment
        transitGateway:
          name: Main-TGW
          account: Network
        routeTableAssociations:
          - Spoke-RT
        routeTablePropagations:
          - Spoke-RT
        subnets:
          - TGW-Attach-Subnet-A
          - TGW-Attach-Subnet-B
          - TGW-Attach-Subnet-C

# ─── TGW Route Tables ─────────────────────────────────────────────────────────
# Ingress-RT:    inbound traffic → Inspection VPC (force through firewall)
# Spoke-RT:      spoke → spoke goes via Inspection VPC (default route to Inspection)
# Inspection-RT: Inspection VPC attachment
# VPN-RT:        on-premises VPN → Inspection VPC then onwards

# ─── Central Network Services ──────────────────────────────────────────────────
centralNetworkServices:
  delegatedAdminAccount: Network
  networkFirewall:
    firewalls:
      - name: Core-Firewall
        firewallPolicy: Core-Firewall-Policy
        vpc: Inspection-VPC
        subnets:
          - Firewall-Subnet-A
          - Firewall-Subnet-B
    policies:
      - name: Core-Firewall-Policy
        regions:
          - eu-west-1
        firewallPolicy:
          statelessDefaultActions:
            - aws:forward_to_sfe
          statelessFragmentDefaultActions:
            - aws:forward_to_sfe
          statelessRuleGroups:
            - name: LZA-Stateless-Rules
              priority: 100
          statefulRuleGroups:
            - name: LZA-Stateful-Rules
              priority: 100
    rules:
      - name: LZA-Stateless-Rules
        type: STATELESS
        regions:
          - eu-west-1
        capacity: 100
        ruleGroup:
          rulesSource:
            statelessRulesAndCustomActions:
              statelessRules:
                - priority: 10
                  ruleDefinition:
                    actions:
                      - aws:forward_to_sfe
                    matchAttributes:
                      sources:
                        - 0.0.0.0/0
                      destinations:
                        - 0.0.0.0/0
      - name: LZA-Stateful-Rules
        type: STATEFUL
        regions:
          - eu-west-1
        capacity: 200
        ruleGroup:
          rulesSource:
            statefulRules:
              - action: PASS
                header:
                  protocol: TCP
                  source: 10.0.0.0/8
                  sourcePort: Any
                  direction: FORWARD
                  destination: 0.0.0.0/0
                  destinationPort: '80'
                ruleOptions:
                  - keyword: msg
                    settings: ["Allow outbound HTTP web traffic"]
                  - keyword: sid
                    settings: ["10001"]
              - action: PASS
                header:
                  protocol: TCP
                  source: 10.0.0.0/8
                  sourcePort: Any
                  direction: FORWARD
                  destination: 0.0.0.0/0
                  destinationPort: '443'
                ruleOptions:
                  - keyword: msg
                    settings: ["Allow outbound HTTPS web traffic"]
                  - keyword: sid
                    settings: ["10002"]
              - action: DROP
                header:
                  protocol: TCP
                  source: Any
                  sourcePort: Any
                  direction: FORWARD
                  destination: 10.0.0.0/8
                  destinationPort: '22'
                ruleOptions:
                  - keyword: msg
                    settings: ["Block SSH access from untrusted sources"]
                  - keyword: sid
                    settings: ["10003"]
  route53Resolver:
    firewallRuleGroups:
      - name: Block-Malicious-Domains
        regions:
          - eu-west-1
        rules:
          - name: Block-Known-Bad-Domains
            action: BLOCK
            priority: 100
            customDomainList: malicious-domains.txt
            blockResponse: NXDOMAIN
