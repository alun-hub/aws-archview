enable: true

# LZA declares OUs as a flat list whose `name` carries the full path, and every
# OU in a path must be listed. A nested `organizationalUnits` array is not part
# of the schema.
organizationalUnits:
  - name: Security
  - name: Infrastructure
  - name: Infrastructure/Network
  - name: Infrastructure/SharedServices
  - name: Workloads
  - name: Workloads/Dev
  - name: Workloads/Test
  - name: Workloads/Prod
  - name: Sandbox
  # Holds closed and quarantined accounts, which LZA must not manage.
  - name: Suspended
    ignore: true

serviceControlPolicies:
  - name: DenyRootUser
    description: Deny root user actions
    policy: service-control-policies/deny-root-user.json
    deploymentTargets:
      organizationalUnits:
        - Security
        - Infrastructure
        - Workloads
        - Sandbox
