# Deliberately flawed variant of organization-config.yaml.
#
# Everything here is a mistake a real team makes. Loaded from
# "Try a config with issues" so the Validation panel has something to show.

enable: true

organizationalUnits:
  - name: Security
  - name: Infrastructure
  - name: Infrastructure/Network
  - name: Infrastructure/SharedServices
  - name: Workloads
  - name: Workloads/Dev
  - name: Workloads/Test
  - name: Workloads/Prod
  - name: Sandbox
  - name: Suspended
    ignore: true

serviceControlPolicies:
  - name: DenyRootUser
    description: Deny root user actions
    type: customerManaged
    policy: service-control-policies/deny-root-user.json
    deploymentTargets:
      organizationalUnits:
        - Security
        - Infrastructure
        - Workloads
        - Sandbox

  # ISSUE: targets an OU that does not exist. The OU is called "Workloads/Prod";
  # "Production" is what people call it in conversation. LZA fails the pipeline.
  - name: DenyProdChanges
    description: Restrict destructive actions in production
    type: customerManaged
    policy: service-control-policies/deny-root-user.json
    deploymentTargets:
      organizationalUnits:
        - Production

taggingPolicies: []
backupPolicies: []
